<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Digital | Cadastro de Pacientes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        header {
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 { font-size: 1.8rem; color: var(--primary-color); }
        header p { color: var(--text-muted); margin-top: 5px; }

        .form-section { margin-bottom: 30px; }
        .form-section h2 { font-size: 1.1rem; margin-bottom: 20px; }

        .grid-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; }

        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn-primary {
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background-color: var(--primary-color);
            color: white;
            transition: background 0.2s;
        }

        .btn-primary:hover { background-color: var(--primary-hover); }

        .list-container {
            background-color: var(--card-bg);
            max-width: 800px;
            width: 100%;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 10px; }
        th { text-align: left; padding: 12px; background: #f8fafc; color: var(--text-muted); border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); }

        @media (max-width: 600px) { .grid-row { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🩺 Clínica Digital</h1>
            <p>Registro de novos pacientes</p>
        </header>

        <form id="formCadastro">
            <section class="form-section">
                <h2>Identificação</h2>
                <div class="grid-row">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required placeholder="Ex: João Silva">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2>Contato</h2>
                <div class="grid-row">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com">
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Salvar Cadastro</button>
            </div>
        </form>
    </div>

    <div class="list-container">
        <h2>Pacientes Cadastrados</h2>
        <table id="tabelaPacientes">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('formCadastro');
        const tbody = document.getElementById('corpoTabela');

        // FUNÇÃO: LISTAR (Chamada ao carregar e após cadastrar)
        async function listarPacientes() {
            try {
                const res = await fetch('/api/listar'); 
                const dados = await res.json();
                
                tbody.innerHTML = '';
                
                if (dados.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum paciente na lista.</td></tr>';
                    return;
                }

                dados.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${p.nome}</td>
                            <td>${p.email || '---'}</td>
                            <td>${p.telefone}</td>
                        </tr>`;
                });
            } catch (err) {
                console.error("Erro ao carregar lista:", err);
            }
        }

        // FUNÇÃO: CADASTRAR
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const novoPaciente = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value
            };

            try {
                const res = await fetch('/api/cadastrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoPaciente)
                });

                if (res.ok) {
                    form.reset();
                    listarPacientes(); // Atualiza a tabela automaticamente
                }
            } catch (err) {
                alert("Erro ao conectar com o servidor.");
            }
        });

        // Carrega a lista assim que a página abre
        window.onload = listarPacientes;
    </script>
</body>
</html>
