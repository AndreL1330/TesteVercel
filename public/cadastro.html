<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Digital | Sistema de Gestão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        header {
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 { font-size: 1.8rem; color: var(--primary-color); }
        header p { color: var(--text-muted); margin-top: 5px; }

        .form-section { margin-bottom: 30px; }
        .form-section h2 { font-size: 1.1rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        .grid-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        .flex-small { flex: 0 0 80px; }

        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        input, select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn-primary, .btn-secondary {
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: #f1f5f9; color: var(--text-muted); }

        /* Estilos da Tabela de Pacientes */
        .list-container {
            background-color: var(--card-bg);
            max-width: 900px;
            width: 100%;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .list-container h2 { margin-bottom: 20px; font-size: 1.2rem; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th { text-align: left; padding: 12px; background: #f8fafc; color: var(--text-muted); border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 600px) { .grid-row { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🩺 Clínica Digital</h1>
            <p>Cadastro centralizado de pacientes</p>
        </header>

        <form id="cadastroForm">
            <section class="form-section">
                <h2>👤 Dados Pessoais</h2>
                <div class="grid-row">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" required placeholder="Nome do paciente">
                    </div>
                </div>
                <div class="grid-row">
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" required placeholder="000.000.000-00">
                    </div>
                    <div class="input-group">
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" id="nascimento" required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2>📍 Contato</h2>
                <div class="grid-row">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="email@exemplo.com">
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="reset" class="btn-secondary">Limpar</button>
                <button type="submit" class="btn-primary">Salvar Cadastro</button>
            </div>
        </form>
    </div>

    <div class="list-container">
        <h2>Pacientes Cadastrados</h2>
        <table id="tabelaPacientes">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('cadastroForm');
        const tabela = document.getElementById('tabelaPacientes').getElementsByTagName('tbody')[0];

        // Carregar dados ao abrir a página
        document.addEventListener('DOMContentLoaded', listarPacientes);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Criar objeto do paciente
            const paciente = {
                id: Date.now(),
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                nascimento: document.getElementById('nascimento').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value
            };

            salvarPaciente(paciente);
            form.reset();
            listarPacientes();
        });

        function salvarPaciente(paciente) {
            let pacientes = JSON.parse(localStorage.getItem('pacientes')) || [];
            pacientes.push(paciente);
            localStorage.setItem('pacientes', JSON.stringify(pacientes));
        }

        function listarPacientes() {
            tabela.innerHTML = '';
            const pacientes = JSON.parse(localStorage.getItem('pacientes')) || [];

            pacientes.forEach(p => {
                let linha = tabela.insertRow();
                linha.innerHTML = `
                    <td>${p.nome}</td>
                    <td>${p.cpf}</td>
                    <td>${p.telefone}</td>
                    <td><button class="btn-delete" onclick="excluirPaciente(${p.id})">Excluir</button></td>
                `;
            });
        }

        function excluirPaciente(id) {
            if (confirm('Deseja realmente excluir este registro?')) {
                let pacientes = JSON.parse(localStorage.getItem('pacientes')) || [];
                pacientes = pacientes.filter(p => p.id !== id);
                localStorage.setItem('pacientes', JSON.stringify(pacientes));
                listarPacientes();
            }
        }
    </script>

</body>
</html>
