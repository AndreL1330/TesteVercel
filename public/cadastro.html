<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Digital | Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        header {
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 { font-size: 1.8rem; color: var(--primary-color); }

        .form-section { margin-bottom: 30px; }
        .grid-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; }

        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn-primary {
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background-color: var(--primary-color);
            color: white;
        }

        .list-container {
            background-color: var(--card-bg);
            max-width: 800px;
            width: 100%;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 10px; }
        th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🩺 Clínica Digital</h1>
            <p>Novo Cadastro de Paciente</p>
        </header>

        <form action="/api/salvar" method="POST">
            <section class="form-section">
                <div class="grid-row">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" name="nome" required placeholder="João Silva">
                    </div>
                </div>
                <div class="grid-row">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" name="email" placeholder="joao@email.com">
                    </div>
                    <div class="input-group">
                        <label for="celular">Celular</label>
                        <input type="tel" name="celular" required placeholder="(00) 00000-0000">
                    </div>
                </div>
            </section>
            <div class="form-actions">
                <button type="submit" class="btn-primary">Salvar no Banco</button>
            </div>
        </form>
    </div>

    <div class="list-container">
        <h2>Pacientes Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Celular</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>

    <script>
        async function listar() {
            const res = await fetch('/api/listar');
            const dados = await res.json();
            const tbody = document.getElementById('corpoTabela');
            tbody.innerHTML = dados.map(p => `
                <tr>
                    <td>${p.nome}</td>
                    <td>${p.email || '---'}</td>
                    <td>${p.celular}</td>
                </tr>
            `).join('');
        }
        window.onload = listar;
    </script>
</body>
</html>
