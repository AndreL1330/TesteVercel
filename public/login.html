<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f4f4; 
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        form { 
            background: #fff; 
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); 
            width: 300px;
            text-align: left;
        }

        label {
            display: block; 
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        
        input { 
            padding: 10px;
            width: 100%; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff; 
            color: #fff;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3; 
        }
    </style>
</head>
<body>
    
    <h1>Acessar o Portal</h1>
    
    <form action="/autenticar" method="POST"> 
        
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required placeholder="Seu e-mail cadastrado">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required placeholder="Sua senha">

        <button type="submit">Entrar</button>
        
    </form>
    
</body>
</html>
