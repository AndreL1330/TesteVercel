<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Busca de Materiais</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; text-align: center; padding: 40px; }
    form { background: #fff; display: inline-block; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    input { padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 8px 14px; border: none; border-radius: 5px; cursor: pointer; }
    button.buscar { background: #007bff; color: #fff; }
    button.excluir { background: #dc3545; color: #fff; }
    button.atualizar { background: #3b49dd; color: #fff; }
    table { margin: 20px auto; border-collapse: collapse; background: #fff; width: 80%; }
    th, td { border: 1px solid #ddd; padding: 10px; }
    th { background: #f7f7f7; }
  </style>
</head>
<body>

  <h1>Buscar e Gerenciar Materiais</h1>

  <form id="formBusca">
    <input type="text" id="nome" placeholder="Digite o nome do material" required>
    <button type="submit" class="buscar">Buscar</button>
  </form>

  <table id="tabela">
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Quantidade</th><th>Preço</th><th>excluir</th><th>Atualizar</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
  const form = document.getElementById('formBusca');
  const tbody = document.querySelector('#tabela tbody');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      if (!nome) return;

      const res = await fetch('/api/buscar?nome=' + encodeURIComponent(nome));
      const materiais = await res.json();

      tbody.innerHTML = '';

      if (materiais.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">Nenhum material encontrado.</td></tr>';
        return;
      }

      materiais.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.id_material}</td>
            <td>${p.nome}</td>
            <td>${p.descricao || ''}</td>
            <td>${p.quantidade}</td>
            <td>R$ ${parseFloat(p.preco).toFixed(2)}</td>
            
            <td><button class="excluir" onclick="excluir(${p.id_material})">Excluir</button></td>

            <td><button class="atualizar" onclick="atualizar(${p.id_material})">Atualizar</button></td>

          </tr>`;
      });
    });

    async function listar(id_material) {
      const res = await fetch('/api/listar/' + id_material);
      const materiais= await res.json();

      tbody.innerHTML = '';

      materiais.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.id_material}</td>
            <td>${p.nome}</td>
            <td>${p.descricao || ''}</td>
            <td>${p.quantidade}</td>
            <td>R$ ${parseFloat(p.preco).toFixed(2)}</td>
          </tr>`;
      });
        
    }

    async function excluir(id_material) {
      if (!confirm('Deseja realmente excluir este produto?')) return;

      const res = await fetch('/api/deletar/' + id_material, { method: 'DELETE' });
      const data = await res.json();

      alert(data.message || data.error);

      document.getElementById('formBusca').dispatchEvent(new Event('submit'));
    }

    async function atualizar(id_material) {
      const novoNome = prompt('Digite o novo nome do material:');
      if (!novoNome) return;

      const novaDescricao = prompt('Digite a nova descrição do material:');
      if (novaDescricao === null) return;

      const novaQuantidade = prompt('Digite a nova quantidade do material:');
      if (novaQuantidade === null || isNaN(novaQuantidade)) return;

      const novoPreco = prompt('Digite o novo preço do material:');
      if (novoPreco === null || isNaN(novoPreco)) return;

      const res = await fetch('/api/atualizar/' + id_material, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: novoNome,
          descricao: novaDescricao,
          quantidade: parseInt(novaQuantidade),
          preco: parseFloat(novoPreco)
        })
      });

      const data = await res.json();
      alert(data.message || data.error);

      document.getElementById('formBusca').dispatchEvent(new Event('submit'));
    }

  </script>

  <p><a href="/cadastro">Voltar ao cadastro</a></p>
</body>
</html>
